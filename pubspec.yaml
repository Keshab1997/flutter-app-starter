name: flutter_app_starter
description: 1-click Flutter starter template with app_pulse_kit, Material 3, EN/BN UI, and flutter-builder CI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  app_pulse_kit:
    git:
      url: https://github.com/Keshab1997/app_pulse_kit.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
